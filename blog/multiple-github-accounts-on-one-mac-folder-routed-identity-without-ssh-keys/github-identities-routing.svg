<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .title { fill: #1a1a1a; font-size: 15px; font-weight: 600; }
    .folder { fill: #eef2f7; stroke: #4a5568; stroke-width: 1.5; }
    .folder-label { fill: #1a2733; font-size: 14px; font-weight: 600; }
    .folder-sub { fill: #5b6b7a; font-size: 11.5px; }
    .card { fill: #ffffff; stroke: #c9d3de; stroke-width: 1.5; }
    .layer-tag { font-size: 10.5px; font-weight: 700; letter-spacing: 0.3px; }
    .card-title { fill: #1a2733; font-size: 13px; font-weight: 600; }
    .card-body { fill: #5b6b7a; font-size: 11px; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .edge { stroke: #9aa7b4; stroke-width: 1.5; fill: none; }
    .foot { fill: #7a8896; font-size: 11px; }
  </style>

  <rect class="bg" x="0" y="0" width="720" height="380" rx="8"/>

  <text class="title" x="24" y="34">How a repo's folder decides its GitHub identity</text>

  <!-- Folder node -->
  <rect class="folder" x="24" y="150" width="150" height="72" rx="8"/>
  <text class="folder-label" x="99" y="182" text-anchor="middle">The folder</text>
  <text class="folder-sub mono" x="99" y="202" text-anchor="middle">~/Code/&lt;tree&gt;/</text>

  <!-- Edges -->
  <path class="edge" d="M174 172 C 250 172, 250 92, 320 92"/>
  <path class="edge" d="M174 186 C 250 186, 250 186, 320 186"/>
  <path class="edge" d="M174 200 C 250 200, 250 280, 320 280"/>

  <!-- Card 1: commit authorship -->
  <rect class="card" x="320" y="58" width="376" height="70" rx="8"/>
  <text class="layer-tag" x="340" y="82" fill="#2b6cb0">LAYER 1</text>
  <text class="card-title" x="340" y="100">Commit authorship</text>
  <text class="card-body" x="340" y="118">Name + email in the commit, via <tspan class="mono">includeIf</tspan> per folder</text>

  <!-- Card 2: push auth -->
  <rect class="card" x="320" y="152" width="376" height="70" rx="8"/>
  <text class="layer-tag" x="340" y="176" fill="#2f855a">LAYER 2</text>
  <text class="card-title" x="340" y="194">Push authentication</text>
  <text class="card-body" x="340" y="212">Account pinned in the HTTPS remote + gh token</text>

  <!-- Card 3: gh cli -->
  <rect class="card" x="320" y="246" width="376" height="70" rx="8"/>
  <text class="layer-tag" x="340" y="270" fill="#c05621">LAYER 3</text>
  <text class="card-title" x="340" y="288"><tspan class="mono">gh</tspan> CLI account</text>
  <text class="card-body" x="340" y="306">Shell wrapper reads the folder, injects the token</text>

  <text class="foot" x="24" y="360">All three resolve from the same folder, so nothing depends on remembering to switch accounts.</text>
</svg>
